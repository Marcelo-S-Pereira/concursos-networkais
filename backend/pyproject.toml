[project]
name = "app-concursos-backend"
version = "0.1.0"
description = "Backend da plataforma de concursos"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]",
    "sqlalchemy==2.0.52",
    "alembic==1.19.1",
    "psycopg[binary]",
    "pydantic[email]",
    "pydantic-settings",
    "python-dotenv",
    "httpx",
    "pgvector",
    "cryptography",
    "bcrypt",
    "python-multipart",
    "itsdangerous",
    "yt-dlp",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008: `Depends(...)` no valor padrão do argumento é a forma idiomática de
# injeção do FastAPI, não um bug. Ignorar aqui é decisão consciente, não
# preguiça - a regra existe para defaults mutáveis comuns, que continuam pegos.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# [125]: texto de prompt inteiro numa linha de dado (seed reusado pela
# migration 0041 e por tests/conftest.py), não código — quebrar em várias
# linhas mudaria a string ou exigiria escapar \n, arriscando divergir do
# texto exato hoje em produção.
"app/modules/prompts/seed.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Sem isso o pytest não acha o pacote `app` (a raiz do backend não entra no
# sys.path sozinha quando os testes vivem em tests/).
pythonpath = ["."]
